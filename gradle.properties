# Gradle 运行参数。首次构建需要联网拉取 NeoForge / Create / CMP 依赖。
# NeoForge 的 createMinecraftArtifacts 要重编译 5000+ 个源文件，1G 堆偏紧，这里给 2G。
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 本机需要代理才能访问 maven.neoforged.net 时取消下面四行注释。
# 用 systemProp 而不是 JAVA_TOOL_OPTIONS：后者会向 fork 出的 javac 打印
# "Picked up JAVA_TOOL_OPTIONS"，混进 NeoForm 的诊断输出里。
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7897
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7897

## 环境版本（对齐上游 Create-Mobile-Packages v0.7.8）
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
neo_version=21.1.219
neo_version_range=[21.1.0,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17


# Gradle 运行参数。首次构建需要联网拉取 NeoForge / Create / CMP 依赖。
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## 环境版本（对齐上游 Create-Mobile-Packages v0.7.8）
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
neo_version=21.1.219
neo_version_range=[21.1.0,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## 本模组元信息
mod_id=create_hivemind
mod_name=Create: Hive Mind
mod_license=MIT License
mod_version=0.0.1
mod_group_id=de.hivemind.create_hivemind
mod_authors=禾冬青
mod_description=An addon for Create: Mobile Packages that adds long-range warp folding and cross-dimension delivery for Robo Bees.
# 可选：logo 放在 src/main/resources/ 下，去掉下一行注释即可生效
# mod_logo=assets/create_hivemind/textures/create_hivemind.png
mod_display_url=https://github.com/ilex-chinensis/create_hivemind

## 依赖版本（与上游 Create-Mobile-Packages 0.7.8 保持一致）
create_version=6.0.10-280
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67

# Create: Mobile Packages 二进制依赖（Modrinth maven：项目 1vXRfEHZ，versionId xSPt2JXH = 1.21.1-0.7.8）
# 坐标写法为 group:artifact:version，即 maven.modrinth:create-mobile-packages:<cmp_version>
cmp_version=xSPt2JXH
